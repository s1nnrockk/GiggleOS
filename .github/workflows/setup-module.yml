name: Setup module checks

on:
  push:
    paths:
      - "setup/**"
      - ".github/workflows/setup-module.yml"
  pull_request:
    paths:
      - "setup/**"
      - ".github/workflows/setup-module.yml"

permissions:
  contents: read

concurrency:
  group: setup-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: setup/native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test

  android-prototype:
    name: Android setup prototype compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust JNI library
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
        working-directory: setup/native
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon :app:assembleDebug
        working-directory: setup
      - uses: actions/upload-artifact@v4
        with:
          name: giggleos-setup-debug
          path: setup/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
